root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
delay = 1000
exclude_dir = ["tmp", "bin", "vendor", "deploy"]
exclude_regex = ["_test.go"]
include_ext = ["go", "sql", "toml", "env"]
kill_delay = "2s"
send_interrupt = true
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
